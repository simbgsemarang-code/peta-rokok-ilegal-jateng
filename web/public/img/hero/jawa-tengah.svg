<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
<style>
  .pindai { animation: naik 5.5s ease-in-out infinite alternate; }
  .kelip { animation: kelip 3s ease-in-out infinite; }
  @keyframes naik { from { transform: translateY(0); } to { transform: translateY(-300px); } }
  @keyframes kelip { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pindai, .kelip { animation: none; } }
</style>
<defs>
  <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060d24"/><stop offset=".55" stop-color="#142a5c"/><stop offset="1" stop-color="#1b6f7a"/></linearGradient>
  <radialGradient id="bulan" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".9"/><stop offset=".45" stop-color="#f5b942" stop-opacity=".25"/><stop offset="1" stop-color="#f5b942" stop-opacity="0"/></radialGradient>
  <linearGradient id="holo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe3ff" stop-opacity=".5"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".12"/></linearGradient>
  <linearGradient id="gunung1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a5a"/><stop offset="1" stop-color="#0a1a3d"/></linearGradient>
  <linearGradient id="gunung2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2149"/><stop offset="1" stop-color="#07122c"/></linearGradient>
  <linearGradient id="garis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe9ff" stop-opacity="0"/><stop offset=".5" stop-color="#8fe9ff" stop-opacity=".85"/><stop offset="1" stop-color="#8fe9ff" stop-opacity="0"/></linearGradient>
  <filter id="pendar" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  <g id="stupa"><path d="M-11 0 A11 11 0 0 1 11 0Z M-1.6 -10 h3.2 v-7 h-3.2z"/></g>
</defs>

<rect width="1600" height="700" fill="url(#langit)"/>
<circle cx="1260" cy="170" r="150" fill="url(#bulan)"/>
<circle cx="1260" cy="170" r="46" fill="#ffe9b0" opacity=".85"/>

<!-- bintang -->
<g fill="#cfeeff" opacity=".75">
  <circle cx="70" cy="60" r="1.7"/><circle cx="210" cy="130" r="1.2"/><circle cx="360" cy="40" r="1.8"/><circle cx="520" cy="95" r="1.2"/><circle cx="700" cy="45" r="1.5"/><circle cx="930" cy="85" r="1.3"/>
  <circle cx="1080" cy="40" r="1.7"/><circle cx="1450" cy="90" r="1.5"/><circle cx="1540" cy="200" r="1.2"/><circle cx="150" cy="240" r="1.3"/>
</g>

<!-- konstelasi 35 kabupaten/kota -->
<g stroke="#7fe3ff" stroke-opacity=".38" stroke-width="1.2" fill="none">
  <path d="M120 300 L260 250 L400 290 L520 215 L650 260 L790 200 L930 250 L1060 215 L1180 280 L1330 245 L1470 300"/>
  <path d="M260 250 L300 360 L430 380 L400 290 M650 260 L690 350 L840 340 L790 200 M930 250 L960 350 L1100 360 L1060 215 M1180 280 L1220 380 L1360 370 L1330 245"/>
</g>
<g fill="#f5b942">
  <circle class="kelip" cx="120" cy="300" r="4.5"/><circle cx="260" cy="250" r="4.5"/><circle class="kelip" cx="400" cy="290" r="4.5"/><circle cx="520" cy="215" r="4.5"/><circle class="kelip" cx="650" cy="260" r="4.5"/>
  <circle cx="790" cy="200" r="4.5"/><circle class="kelip" cx="930" cy="250" r="4.5"/><circle cx="1060" cy="215" r="4.5"/><circle class="kelip" cx="1180" cy="280" r="4.5"/><circle cx="1330" cy="245" r="4.5"/>
  <circle class="kelip" cx="1470" cy="300" r="4.5"/><circle cx="300" cy="360" r="3.6"/><circle cx="430" cy="380" r="3.6"/><circle cx="690" cy="350" r="3.6"/><circle cx="840" cy="340" r="3.6"/>
  <circle cx="960" cy="350" r="3.6"/><circle cx="1100" cy="360" r="3.6"/><circle cx="1220" cy="380" r="3.6"/><circle cx="1360" cy="370" r="3.6"/>
</g>

<!-- pegunungan (Merapi, Merbabu, Sindoro) -->
<path d="M0 600 L0 470 L110 400 L260 330 L330 365 L430 300 L520 380 L610 440 L700 470 L700 600Z" fill="url(#gunung1)"/>
<path d="M900 600 L900 470 L1010 420 L1130 360 L1220 300 L1300 360 L1400 410 L1500 380 L1600 430 L1600 600Z" fill="url(#gunung1)"/>
<path d="M0 600 L0 540 L150 490 L300 520 L460 470 L620 520 L760 560 L760 600Z" fill="url(#gunung2)"/>
<path d="M840 600 L840 550 L1000 500 L1180 530 L1340 480 L1480 520 L1600 490 L1600 600Z" fill="url(#gunung2)"/>
<path d="M260 330 L330 365 L430 300 L520 380 M1130 360 L1220 300 L1300 360" stroke="#7fe3ff" stroke-opacity=".6" stroke-width="2" fill="none"/>

<!-- Candi Borobudur holografik -->
<g transform="translate(0 0)">
  <ellipse cx="800" cy="610" rx="470" ry="26" fill="#5fe0ff" opacity=".25" filter="url(#pendar)"/>
  <g fill="url(#holo)" stroke="#7fe3ff" stroke-width="2.4" stroke-linejoin="round">
    <rect x="420" y="560" width="760" height="40"/><rect x="480" y="520" width="640" height="40"/><rect x="530" y="484" width="540" height="36"/>
    <rect x="575" y="452" width="450" height="32"/><rect x="615" y="424" width="370" height="28"/>
    <rect x="655" y="404" width="290" height="20" rx="10"/><rect x="690" y="386" width="220" height="18" rx="9"/><rect x="720" y="370" width="160" height="16" rx="8"/>
    <path d="M754 370 A46 40 0 0 1 846 370Z"/><path d="M797 300 h6 v32 h-6z"/><path d="M800 278 L809 300 H791Z"/>
  </g>
  <!-- tangga tengah -->
  <g fill="#7fe3ff" opacity=".28"><rect x="778" y="424" width="44" height="176"/><rect x="778" y="404" width="44" height="20"/></g>
  <g stroke="#7fe3ff" stroke-opacity=".55" stroke-width="1.4"><path d="M778 440 H822 M778 460 H822 M778 480 H822 M778 500 H822 M778 520 H822 M778 540 H822 M778 560 H822 M778 580 H822"/></g>
  <!-- relung / stupa teras -->
  <g stroke="#7fe3ff" stroke-opacity=".5" stroke-width="1.6"><path d="M450 580 H1150 M510 540 H1090 M555 502 H1045 M595 468 H1005 M630 438 H970"/></g>
  <g fill="#9ff0ff" stroke="#7fe3ff" stroke-width="1">
    <use href="#stupa" x="690" y="404"/><use href="#stupa" x="740" y="404"/><use href="#stupa" x="860" y="404"/><use href="#stupa" x="910" y="404"/>
    <use href="#stupa" x="725" y="386"/><use href="#stupa" x="775" y="386"/><use href="#stupa" x="825" y="386"/><use href="#stupa" x="875" y="386"/>
    <use href="#stupa" x="742" y="370"/><use href="#stupa" x="858" y="370"/>
  </g>
  <!-- garis pindai -->
  <g class="pindai"><rect x="400" y="595" width="800" height="14" fill="url(#garis)"/></g>
</g>

<!-- lantai grid -->
<g stroke="#5fe0ff" stroke-opacity=".25" stroke-width="1.5" fill="none">
  <path d="M0 625 H1600 M0 650 H1600 M0 680 H1600"/>
  <path d="M800 600 L-300 700 M800 600 L-60 700 M800 600 L200 700 M800 600 L500 700 M800 600 L1100 700 M800 600 L1400 700 M800 600 L1660 700 M800 600 L1900 700"/>
</g>
<g stroke="#7fe3ff" stroke-opacity=".7" stroke-width="3" fill="none"><path d="M40 80 V40 H80 M1560 80 V40 H1520 M40 620 V660 H80 M1560 620 V660 H1520"/></g>
</svg>
