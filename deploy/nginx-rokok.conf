# Templat virtual host nginx. pasang.sh mengisi __DOMAIN__, __APP_DIR__, dan __PHPV__ lalu menaruhnya di
# /etc/nginx/sites-available/peta-rokok. HTTPS ditambahkan oleh certbot (certbot --nginx).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/web/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Impor Excel sampai 30 MB (batas aplikasi) ditambah ruang untuk formulir
    client_max_body_size 40M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Batasi percobaan masuk (hanya POST; zona dibuat di conf.d/peta-batas.conf)
    location = /masuk {
        limit_req zone=masuk burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # Berkas statis
    location ~* \.(?:css|js|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Tidak ada akses ke berkas tersembunyi (.env, .git), kecuali /.well-known untuk sertifikat
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/peta-rokok.access.log;
    error_log  /var/log/nginx/peta-rokok.error.log warn;
}
